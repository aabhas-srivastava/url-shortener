<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snip — URL Shortener</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #7c6aff;
    --accent2: #ff6a9b;
    --text: #f0f0f8;
    --muted: #6b6b88;
    --success: #4ade80;
    --danger: #ff6a6a;
    --warning: #fbbf24;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.15;
  }
  .glow-1 { background: var(--accent); top: -200px; left: -200px; }
  .glow-2 { background: var(--accent2); bottom: -200px; right: -200px; }

  .container {
    position: relative;
    z-index: 1;
    max-width: 740px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 36px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo span { font-weight: 400; opacity: 0.5; -webkit-text-fill-color: var(--muted); }

  /* Hero */
  .hero {
    padding: 64px 0 48px;
    text-align: center;
  }

  .hero h1 {
    font-size: clamp(36px, 6vw, 58px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }

  .hero h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p {
    font-size: 17px;
    color: var(--muted);
    font-weight: 400;
    max-width: 420px;
    margin: 0 auto;
    line-height: 1.6;
    font-family: 'DM Mono', monospace;
  }

  /* Main card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 16px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  .input-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .input-wrap {
    position: relative;
  }

  input[type="text"], input[type="url"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]:focus, input[type="url"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.12);
  }

  input::placeholder { color: var(--muted); }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn {
    width: 100%;
    padding: 15px 24px;
    border-radius: 12px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9b6aff);
    color: white;
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,106,255,0.35); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Result box */
  .result {
    display: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    margin-top: 16px;
    animation: slideUp 0.3s ease;
  }

  .result.show { display: block; }
  .result.error { border-color: rgba(255,106,106,0.4); background: rgba(255,106,106,0.05); }
  .result.success { border-color: rgba(74,222,128,0.3); }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .short-url-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }

  .short-url-text {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: var(--accent);
    word-break: break-all;
  }

  .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--success); color: var(--success); }

  .open-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.25);
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--success);
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 10px;
  }
  .open-btn:hover { background: rgba(74,222,128,0.14); }

  .meta-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .meta-item span { color: var(--text); }

  .error-msg {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--danger);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    border-radius: 9px;
    border: none;
    background: transparent;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .tab.active {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Analytics panel */
  .analytics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }

  .stat-number {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* History */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
    text-decoration: none;
  }

  .history-item:hover { border-color: var(--accent); }

  .history-code {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    min-width: 80px;
  }

  .history-url {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-clicks {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
  }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  /* QR Panel */
  .qr-wrap {
    text-align: center;
    padding: 16px 0;
  }

  .qr-wrap img {
    width: 200px;
    height: 200px;
    border-radius: 12px;
    border: 4px solid var(--surface2);
  }

  .qr-placeholder {
    width: 200px;
    height: 200px;
    background: var(--surface2);
    border-radius: 12px;
    border: 2px dashed var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  .pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  .pill-active { background: rgba(74,222,128,0.12); color: var(--success); }
  .pill-expired { background: rgba(255,106,106,0.12); color: var(--danger); }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    padding: 32px 0 48px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 540px) {
    .row { grid-template-columns: 1fr; }
    .analytics-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="container">
  <header>
    <div class="logo">snip<span>.io</span></div>
    <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">localhost:8080</div>
  </header>

  <div class="hero">
    <h1>Shorten any URL<br><em>instantly.</em></h1>
    <p>Paste a long link. Get a short one. Track every click.</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('create')">Create</button>
      <button class="tab" onclick="switchTab('analytics')">Analytics</button>
      <button class="tab" onclick="switchTab('history')">History</button>
    </div>

    <!-- CREATE TAB -->
    <div class="tab-panel active" id="tab-create">
      <div class="input-group">
        <div>
          <div class="input-label">Long URL</div>
          <input type="url" id="longUrl" placeholder="https://www.youtube.com/watch?v=..." />
        </div>
        <div class="row">
          <div>
            <div class="input-label">Custom code (optional)</div>
            <input type="text" id="customCode" placeholder="e.g. java101" maxlength="10"/>
          </div>
          <div>
            <div class="input-label">Expiry date (optional)</div>
            <input type="text" id="expiryDate" placeholder="e.g. 2026-12-31"/>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" id="shortenBtn" onclick="shortenUrl()">Shorten URL</button>

      <div class="result" id="result"></div>
    </div>

    <!-- ANALYTICS TAB -->
    <div class="tab-panel" id="tab-analytics">
      <div class="input-group">
        <div>
          <div class="input-label">Short code</div>
          <div style="display:flex;gap:10px">
            <input type="text" id="analyticsCode" placeholder="e.g. java101" style="flex:1"/>
            <button class="btn btn-primary" style="width:auto;padding:14px 20px" onclick="fetchAnalytics()">Check</button>
          </div>
        </div>
      </div>
      <div id="analyticsResult"></div>
    </div>

    <!-- HISTORY TAB -->
    <div class="tab-panel" id="tab-history">
      <div class="history-list" id="historyList">
        <div class="empty-state">No links created yet.<br>Create your first short URL!</div>
      </div>
    </div>
  </div>

  <footer>built with Spring Boot + Redis + MySQL &mdash; running on localhost</footer>
</div>

<script>
const API = 'http://localhost:8080';
let history = JSON.parse(localStorage.getItem('snip_history') || '[]');

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['create','analytics','history'][i] === tab);
  });
  document.querySelectorAll('.tab-panel').forEach((p,i) => {
    p.classList.toggle('active', ['tab-create','tab-analytics','tab-history'][i] === 'tab-'+tab);
  });
  if (tab === 'history') renderHistory();
}

async function shortenUrl() {
  const longUrl = document.getElementById('longUrl').value.trim();
  const customCode = document.getElementById('customCode').value.trim();
  const expiryDate = document.getElementById('expiryDate').value.trim();
  const btn = document.getElementById('shortenBtn');
  const resultDiv = document.getElementById('result');

  if (!longUrl) { showResult('error', 'Please enter a URL first.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Shortening...';

  const body = { originalUrl: longUrl };
  if (customCode) body.customCode = customCode;
  if (expiryDate) body.expiresAt = expiryDate + 'T00:00:00';

  try {
    const res = await fetch(`${API}/api/urls`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (!res.ok) {
      const msg = data.message || data.originalUrl || data.customCode || 'Something went wrong.';
      showResult('error', msg);
    } else {
      saveHistory(data);
      showSuccess(data);
    }
  } catch (e) {
    showResult('error', 'Cannot connect to server. Is Docker running?');
  }

  btn.disabled = false;
  btn.innerHTML = 'Shorten URL';
}

function showSuccess(data) {
  const shortUrl = data.shortUrl;
  const expiry = data.expiresAt ? new Date(data.expiresAt).toLocaleDateString() : 'Never';
  document.getElementById('result').className = 'result success show';
  document.getElementById('result').innerHTML = `
    <div class="result-label">Your short link is ready</div>
    <div class="short-url-row">
      <span class="short-url-text">${shortUrl}</span>
      <button class="copy-btn" onclick="copyUrl('${shortUrl}', this)">Copy</button>
    </div>
    <a class="open-btn" href="${shortUrl}" target="_blank">Open Link &rarr;</a>
    <div class="meta-row">
      <div class="meta-item">Code: <span>${data.shortCode}</span></div>
      <div class="meta-item">Clicks: <span>${data.clickCount}</span></div>
      <div class="meta-item">Expires: <span>${expiry}</span></div>
      <div class="meta-item">Status: <span class="pill pill-active">Active</span></div>
    </div>
  `;
}

function showResult(type, msg) {
  document.getElementById('result').className = `result ${type} show`;
  document.getElementById('result').innerHTML = `<div class="error-msg">${msg}</div>`;
}

function copyUrl(url, btn) {
  navigator.clipboard.writeText(url);
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
}

async function fetchAnalytics() {
  const code = document.getElementById('analyticsCode').value.trim();
  const div = document.getElementById('analyticsResult');
  if (!code) { div.innerHTML = '<div class="error-msg">Enter a short code first.</div>'; return; }

  div.innerHTML = '<div style="color:var(--muted);font-family:\'DM Mono\',monospace;font-size:13px">Loading...</div>';

  try {
    const res = await fetch(`${API}/api/urls/${code}/analytics`);
    const data = await res.json();
    if (!res.ok) {
      div.innerHTML = `<div class="error-msg">${data.message || 'Not found.'}</div>`;
    } else {
      const expiry = data.expiresAt ? new Date(data.expiresAt).toLocaleDateString() : 'Never';
      const created = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : '-';
      div.innerHTML = `
        <div class="analytics-grid">
          <div class="stat-card">
            <div class="stat-number" style="color:var(--accent)">${data.totalClicks}</div>
            <div class="stat-label">Total Clicks</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" style="font-size:16px;padding-top:6px">${created}</div>
            <div class="stat-label">Created</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" style="font-size:16px;padding-top:6px">${expiry}</div>
            <div class="stat-label">Expires</div>
          </div>
        </div>
        <div class="short-url-row">
          <span class="short-url-text" style="color:var(--muted);font-size:12px">${data.originalUrl}</span>
          <span class="pill ${data.active ? 'pill-active' : 'pill-expired'}">${data.active ? 'Active' : 'Inactive'}</span>
        </div>
        <a class="open-btn" href="${API}/${code}" target="_blank">Open Short Link &rarr;</a>
        <div style="margin-top:10px">
          <a href="${API}/api/urls/${code}/qr" target="_blank" style="font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);text-decoration:none">View QR Code &rarr;</a>
        </div>
      `;
    }
  } catch(e) {
    div.innerHTML = '<div class="error-msg">Cannot connect to server.</div>';
  }
}

function saveHistory(data) {
  history = history.filter(h => h.shortCode !== data.shortCode);
  history.unshift({ shortCode: data.shortCode, shortUrl: data.shortUrl, originalUrl: data.originalUrl, clickCount: data.clickCount });
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem('snip_history', JSON.stringify(history));
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!history.length) {
    list.innerHTML = '<div class="empty-state">No links created yet.<br>Create your first short URL!</div>';
    return;
  }
  list.innerHTML = history.map(h => `
    <a class="history-item" href="${h.shortUrl}" target="_blank">
      <span class="history-code">${h.shortCode}</span>
      <span class="history-url">${h.originalUrl}</span>
      <span class="history-clicks">${h.clickCount} clicks</span>
    </a>
  `).join('');
}
</script>
</body>
</html>
